[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutionary-quant-system"
version = "0.1.0"
description = "Institutional-style autonomous quantitative research and trading platform"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "tzdata>=2025.2; platform_system == \"Windows\""]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
